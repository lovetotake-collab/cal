<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복기용 매매 계산기 & 타점 시뮬레이터</title>
    <style>
        /* === UI Design System (Offline Standalone) === */
        :root {
            --bg-color: #0f172a;        
            --panel-bg: #1e293b;         
            --text-main: #f1f5f9;       
            --text-sub: #94a3b8;        
            --border-color: #334155;    
            --buy-color: #ef4444;       
            --sell-color: #3b82f6;      
            --input-bg: #020617;
            
            /* 간단 계산기 전용 색상 */
            --color-yellow: #facc15;
            --color-blue: #3b82f6;
            --color-purple: #a855f7;
            --color-green: #22c55e;
            --color-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px;
            min-height: 100vh;
        }

        /* === Header & Unit Config === */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto 20px auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .unit-config {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .unit-config-label {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--color-yellow);
        }

        .unit-config-input {
            width: 150px;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            text-align: right;
            padding: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        .unit-config-input:focus {
            border-color: var(--color-yellow);
        }

        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
            .unit-config {
                width: 100%;
                justify-content: space-between;
            }
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Panel Header & Summary */
        .panel-header {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }
        
        .header-buy { color: var(--buy-color); border-bottom-color: var(--buy-color); }
        .header-sell { color: var(--sell-color); border-bottom-color: var(--sell-color); }
        .header-calc { color: var(--color-yellow); border-bottom-color: var(--color-yellow); }

        .summary-box {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            gap: 16px;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .summary-item + .summary-item {
            border-left: 1px solid var(--border-color);
            padding-left: 16px;
        }

        .summary-item.center {
            align-items: center;
            text-align: center;
        }

        .summary-item:last-child {
            text-align: right;
            align-items: flex-end;
        }

        .summary-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .summary-value {
            font-size: 1.4rem;
            font-weight: 900;
        }

        /* Inputs & Rows */
        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .row:hover {
            border-color: var(--border-color);
        }

        /* 입력순서 뱃지 */
        .seq-badge {
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 6px;
            border-radius: 6px;
            min-width: 32px;
            text-align: center;
        }

        .row-label {
            width: 75px;
            font-weight: 800;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-title {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 700;
            margin-left: 2px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            text-align: right;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #94a3b8;
        }

        /* Buttons */
        .btn-add {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-add:hover { opacity: 0.85; }
        .btn-add-buy { background: var(--buy-color); }
        .btn-add-sell { background: var(--sell-color); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: none;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #ef4444;
            color: white;
        }

        /* === 간단 계산기(Simple Calculator) 전용 CSS === */
        .calc-inputs {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .calc-outputs {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .out-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 120px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .out-box-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-sub);
        }

        .out-box-val {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .txt-yellow { color: var(--color-yellow); }
        .txt-blue { color: var(--color-blue); }
        .txt-purple { color: var(--color-purple); }
        .txt-green { color: var(--color-green); }
        .txt-red { color: var(--color-red); }

    </style>
</head>
<body>

    <!-- 1. 앱 헤더 및 1유닛 설정 -->
    <header class="app-header">
        <h1>📊 복기용 매매 계산기</h1>
        <div class="unit-config">
            <span class="unit-config-label">💡 1유닛 기준금액 (원)</span>
            <input type="text" id="unit-base" class="unit-config-input" value="1,000,000" oninput="handleInput(event)">
        </div>
    </header>

    <div class="container">
        <!-- 2. 분할매수 패널 -->
        <div class="panel">
            <div class="panel-header header-buy">📈 분할매수 입력</div>
            
            <div class="summary-box">
                <div class="summary-item">
                    <span class="summary-label">평단가</span>
                    <span class="summary-value" id="avg-price">0원</span>
                </div>
                <div class="summary-item">
                    <!-- 현재비중으로 통일 -->
                    <span class="summary-label">현재비중</span>
                    <span class="summary-value" id="total-weight" style="color: var(--text-main);">0원</span>
                </div>
            </div>

            <div id="buy-container">
                <!-- Javascript를 통해 행이 추가됩니다 -->
            </div>

            <button class="btn-add btn-add-buy" onclick="addBuyRow()">+ 매수 추가</button>
        </div>

        <!-- 3. 분할매도 패널 -->
        <div class="panel">
            <div class="panel-header header-sell">📉 분할매도 입력</div>
            
            <div class="summary-box">
                <div class="summary-item">
                    <span class="summary-label">누적 손익률</span>
                    <span class="summary-value" id="pnl-rate">0.00%</span>
                </div>
                <div class="summary-item center">
                    <span class="summary-label">누적 손익금액</span>
                    <span class="summary-value" id="pnl-amount">0원</span>
                </div>
                <div class="summary-item">
                    <!-- 현재비중으로 통일 -->
                    <span class="summary-label">현재비중</span>
                    <span class="summary-value" id="remain-weight" style="color: var(--text-main);">0원</span>
                </div>
            </div>

            <div id="sell-container">
                <!-- Javascript를 통해 행이 추가됩니다 -->
            </div>

            <button class="btn-add btn-add-sell" onclick="addSellRow()">+ 매도 추가</button>
        </div>

        <!-- 4. 간단 계산기 패널 -->
        <div class="panel full-width">
            <div class="panel-header header-calc">🧮 간단 타점 계산기</div>
            
            <div class="calc-inputs">
                <div class="input-group">
                    <span class="input-title">최저점 가격 (원)</span>
                    <input type="text" id="calc-lowest" placeholder="0" oninput="handleCalcPriceInput(event)">
                </div>
                <div class="input-group">
                    <span class="input-title">기본폭 (%)</span>
                    <input type="text" id="calc-width" placeholder="예: 3.5" oninput="calculateSimple()">
                </div>
            </div>

            <div class="calc-outputs">
                <div class="out-box">
                    <span class="out-box-label">기본폭 가격</span>
                    <span class="out-box-val txt-yellow" id="out-base">0원</span>
                </div>
                <div class="out-box">
                    <span class="out-box-label">+ 4% 반등</span>
                    <span class="out-box-val txt-blue" id="out-4p">0원</span>
                </div>
                <div class="out-box">
                    <span class="out-box-label">+ 5% 반등</span>
                    <span class="out-box-val txt-purple" id="out-5p">0원</span>
                </div>
                <div class="out-box">
                    <span class="out-box-label">+ 6% 반등</span>
                    <span class="out-box-val txt-red" id="out-6p">0원</span>
                </div>
                <div class="out-box">
                    <span class="out-box-label">+ 7% 반등</span>
                    <span class="out-box-val txt-green" id="out-7p">0원</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // [Core Engine] 실시간 연산 및 동적 UI 로직 (Vanilla JS)
        // =========================================================================
        
        // 숫자 포맷팅 (콤마 추가, 소수점 보존)
        function formatNumber(num) {
            if (num === null || num === undefined) return "0";
            const parts = num.toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join(".");
        }

        // 콤마 제거 및 숫자로 변환
        function unformatNumber(str) {
            if (typeof str === 'number') return str;
            const raw = str.replace(/[^0-9.-]/g, '');
            return raw ? parseFloat(raw) : 0;
        }

        // 입력 폼 핸들러
        function handleInput(event) {
            const input = event.target;
            const val = unformatNumber(input.value);
            input.value = val === 0 ? '' : formatNumber(val);
            calculateAll();
        }

        // =========================================================================
        // [Module 1] 동적 DOM 생성 및 라벨 업데이트
        // =========================================================================

        function getNextOrderSeq() {
            const allRows = document.querySelectorAll('.row');
            let maxSeq = 0;
            allRows.forEach(row => {
                const seq = parseInt(row.getAttribute('data-order'), 10);
                if (!isNaN(seq) && seq > maxSeq) {
                    maxSeq = seq;
                }
            });
            return maxSeq + 1;
        }

        function createRowHTML(type, labelName) {
            const orderSeq = getNextOrderSeq(); 
            const isBuy = type === 'buy';
            return `
                <div class="row" data-order="${orderSeq}" data-type="${type}">
                    <div class="seq-badge" title="타임라인 입력 순서">#${orderSeq}</div>
                    <div class="row-label">${labelName}</div>
                    <div class="input-group">
                        <span class="input-title">${isBuy ? '매수가격' : '매도가격'}</span>
                        <input type="text" class="price-input" placeholder="0" oninput="handleInput(event)">
                    </div>
                    <div class="input-group">
                        <span class="input-title">${isBuy ? '매수(유닛)' : '매도(유닛)'}</span>
                        <input type="text" class="amount-input" placeholder="1" oninput="handleInput(event)">
                    </div>
                    <button class="btn-delete" onclick="deleteRow(this, '${type}')" title="삭제">×</button>
                </div>
            `;
        }

        function updateLabels(containerId, suffix) {
            const container = document.getElementById(containerId);
            const rows = container.getElementsByClassName('row');
            for (let i = 0; i < rows.length; i++) {
                rows[i].querySelector('.row-label').innerText = (i + 1) + suffix;
            }
        }

        function addBuyRow() {
            const container = document.getElementById('buy-container');
            container.insertAdjacentHTML('beforeend', createRowHTML('buy', ''));
            updateLabels('buy-container', '차 매수');
        }

        function addSellRow() {
            const container = document.getElementById('sell-container');
            container.insertAdjacentHTML('beforeend', createRowHTML('sell', ''));
            updateLabels('sell-container', '차 매도');
        }

        function deleteRow(button, type) {
            button.closest('.row').remove();
            if (type === 'buy') {
                updateLabels('buy-container', '차 매수');
            } else {
                updateLabels('sell-container', '차 매도');
            }
            calculateAll();
        }

        // =========================================================================
        // [Module 2] 타임라인 퀀트 알고리즘 (유닛 비례 차감 로직 - 전량매도 0원 보장)
        // =========================================================================
        
        function calculateAll() {
            const unitBase = unformatNumber(document.getElementById('unit-base').value) || 1;
            const allRows = Array.from(document.querySelectorAll('.row'));
            
            // 입력(타임라인) 순서대로 정렬
            allRows.sort((a, b) => parseInt(a.getAttribute('data-order')) - parseInt(b.getAttribute('data-order')));

            let currentUnits = 0;    // 실시간 보유 유닛(비중)
            let currentShares = 0;   // 실시간 보유 주식수
            let avgPrice = 0;        // 실시간 가중 평균가
            let realizedPnl = 0;     // 누적 실현 손익
            let totalCostOfSold = 0; // 누적 매도 원가 (수익률 산출용)

            allRows.forEach(row => {
                const type = row.getAttribute('data-type');
                const price = unformatNumber(row.querySelector('.price-input').value);
                const unit = unformatNumber(row.querySelector('.amount-input').value);
                
                if (price > 0 && unit > 0) {
                    if (type === 'buy') {
                        // [매수 로직]
                        const amount = unit * unitBase; 
                        const sharesToBuy = amount / price;
                        const currentPrincipal = currentShares * avgPrice; 
                        
                        currentUnits += unit;
                        currentShares += sharesToBuy;
                        avgPrice = (currentPrincipal + amount) / currentShares;

                    } else if (type === 'sell') {
                        // [매도 로직 - 비례 차감]
                        // 보유한 유닛수까지만 매도 가능하도록 안전 장치 적용
                        let sellUnit = Math.min(unit, currentUnits);
                        
                        if (sellUnit > 0 && currentUnits > 0) {
                            // 전체 유닛 중 팔려는 유닛의 비율만큼 주식수를 차감
                            const sellRatio = sellUnit / currentUnits;
                            let sharesToSell = currentShares * sellRatio;
                            
                            // 초과 매도 방어
                            sharesToSell = Math.min(sharesToSell, currentShares);

                            const costOfSold = sharesToSell * avgPrice; 
                            const actualSellAmount = sharesToSell * price; 
                            
                            realizedPnl += (actualSellAmount - costOfSold);
                            totalCostOfSold += costOfSold;
                            
                            currentShares -= sharesToSell;
                            currentUnits -= sellUnit;
                            
                            // 잔량 0 보정 (부동소수점 오차로 인한 찌꺼기 방어)
                            if (currentUnits <= 0.0001 || currentShares <= 0.0001) {
                                currentUnits = 0;
                                currentShares = 0;
                                avgPrice = 0;
                            }
                        }
                    }
                }
            });

            // 최종 잔여 비중 (현재비중) 계산
            const currentWeight = currentShares * avgPrice;
            const pnlRate = totalCostOfSold > 0 ? (realizedPnl / totalCostOfSold) * 100 : 0;

            // UI 렌더링
            document.getElementById('avg-price').innerText = formatNumber(Math.round(avgPrice)) + '원';
            
            // 매수/매도 패널 모두 '현재비중'으로 통일
            document.getElementById('total-weight').innerText = formatNumber(Math.round(currentWeight)) + '원';
            document.getElementById('remain-weight').innerText = formatNumber(Math.round(currentWeight)) + '원';
            
            const pnlRateEl = document.getElementById('pnl-rate');
            const pnlAmountEl = document.getElementById('pnl-amount');

            pnlRateEl.innerText = pnlRate.toFixed(2) + '%';
            pnlAmountEl.innerText = formatNumber(Math.round(realizedPnl)) + '원';

            // HTS 표준 색상 렌더링 (수익: Red, 손실: Blue)
            if (realizedPnl > 0) {
                pnlRateEl.style.color = 'var(--buy-color)';
                pnlAmountEl.style.color = 'var(--buy-color)';
            } else if (realizedPnl < 0) {
                pnlRateEl.style.color = 'var(--sell-color)';
                pnlAmountEl.style.color = 'var(--sell-color)';
            } else {
                pnlRateEl.style.color = 'var(--text-main)';
                pnlAmountEl.style.color = 'var(--text-main)';
            }
        }

        // =========================================================================
        // [Module 3] 간단 타점 계산기
        // =========================================================================
        
        function handleCalcPriceInput(event) {
            const input = event.target;
            const val = unformatNumber(input.value);
            input.value = val === 0 ? '' : formatNumber(val);
            calculateSimple();
        }

        function calculateSimple() {
            const lowestPrice = unformatNumber(document.getElementById('calc-lowest').value);
            const widthRaw = document.getElementById('calc-width').value.replace(/[^0-9.-]/g, '');
            const widthPct = parseFloat(widthRaw) || 0;

            if (lowestPrice > 0) {
                const basePrice = lowestPrice * (1 + (widthPct / 100));
                const price4p = lowestPrice * 1.04;
                const price5p = lowestPrice * 1.05;
                const price6p = lowestPrice * 1.06;
                const price7p = lowestPrice * 1.07;

                document.getElementById('out-base').innerText = formatNumber(Math.round(basePrice)) + '원';
                document.getElementById('out-4p').innerText = formatNumber(Math.round(price4p)) + '원';
                document.getElementById('out-5p').innerText = formatNumber(Math.round(price5p)) + '원';
                document.getElementById('out-6p').innerText = formatNumber(Math.round(price6p)) + '원';
                document.getElementById('out-7p').innerText = formatNumber(Math.round(price7p)) + '원';
            } else {
                document.getElementById('out-base').innerText = '0원';
                document.getElementById('out-4p').innerText = '0원';
                document.getElementById('out-5p').innerText = '0원';
                document.getElementById('out-6p').innerText = '0원';
                document.getElementById('out-7p').innerText = '0원';
            }
        }

        // 시스템 초기화
        window.onload = () => {
            addBuyRow();
        };
    </script>
</body>
</html>
